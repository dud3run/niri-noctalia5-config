[backdrop]
blur_intensity = 0.089999997988343239
enabled = true
tint_intensity = 0.13999999687075615

[bar.default]
concave_edge_corners = false
margin_ends = 0
radius = 0

[dock]
auto_hide = true
enabled = true
icon_size = 39
launcher_position = "end"
pinned = [ "org.mozilla.firefox", "org.kde.dolphin", "Throne" ]
reserve_space = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 768.0
    cx = 960.00006103515625
    cy = 752.39996337890625
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "tadomika_ari/w-engine", "noctalia/mpvpaper" ]

[shell.launcher]
app_grid = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/anon/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/anon/Pictures/Wallpapers/wallhaven_p218gj.jpg"

    [wallpaper.last]
    path = "/home/anon/Pictures/Wallpapers/wallhaven_p218gj.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/anon/Pictures/Wallpapers/wallhaven_p218gj.jpg"
